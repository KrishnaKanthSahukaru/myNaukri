name: Naukri profile automation

on:
  schedule:
    # We set a broad schedule to check every 15 minutes.
    # Because it is a 15-min window, GitHub will reliably fire it.
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  update-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Time Window
        id: timer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the timestamp of when this ran successfully last time
          LAST_RUN=$(gh api repos/${{ github.repository }}/actions/variables/LAST_AUTOMATION_TIME --template '{{.value}}' 2>/dev/null || echo "0")
          CURRENT_TIME=$(date +%s)
          
          # Calculate how many seconds passed (30 minutes = 1800 seconds)
          TIME_DIFF=$((CURRENT_TIME - LAST_RUN))
          
          if [ $TIME_DIFF -lt 1700 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "30 minutes have not passed yet. Skipping execution to save minutes."
            echo "run_job=false" >> $GITHUB_OUTPUT
          else
            echo "Time threshold met! Running automation."
            echo "run_job=true" >> $GITHUB_OUTPUT
            
            # Update the variable in GitHub for the next loop
            gh api --method PATCH repos/${{ github.repository }}/actions/variables/LAST_AUTOMATION_TIME -f value="$CURRENT_TIME" || \
            gh api --method POST repos/${{ github.repository }}/actions/variables -f name="LAST_AUTOMATION_TIME" -f value="$CURRENT_TIME"
          fi

      - name: Setup Node.js
        if: steps.timer.outputs.run_job == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.timer.outputs.run_job == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.timer.outputs.run_job == 'true'
        run: npx playwright install --with-deps chromium

      - name: Create local credentials file
        if: steps.timer.outputs.run_job == 'true'
        env:
          NAUKRI_CREDENTIALS_JSON: ${{ secrets.NAUKRI_CREDENTIALS_JSON }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const profiles = JSON.parse(process.env.NAUKRI_CREDENTIALS_JSON || 'null');
          if (!Array.isArray(profiles) || profiles.length !== 2 || profiles.some((profile) => !profile.email || !profile.password)) {
            throw new Error('Set the NAUKRI_CREDENTIALS_JSON repository secret to an array of two profile objects.');
          }
          fs.writeFileSync('credentials.json', JSON.stringify(profiles), { mode: 0o600 });
          NODE

      - name: Run profile updates
        if: steps.timer.outputs.run_job == 'true'
        run: npm run update-profiles -- --retries=0
