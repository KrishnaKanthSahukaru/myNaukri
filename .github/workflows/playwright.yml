name: Naukri profile automation

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naukri-profile-automation
  cancel-in-progress: false

jobs:
  update-profiles:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show GitHub runner public IP
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "GitHub Runner Public IP"
          Write-Host "========================================"
          try {
            $ip = Invoke-RestMethod https://ipify.org
            Write-Host "Public IP: $ip"
          }
          catch {
            Write-Host "Unable to determine public IP"
            Write-Host $_
          }
          Write-Host "========================================"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run Naukri Profile Automation
        env:
          NAUKRI_CREDENTIALS_JSON: ${{ secrets.NAUKRI_CREDENTIALS_JSON }}
        run: npx playwright test tests/Naukri.spec.js

      - name: Upload Diagnostic HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
