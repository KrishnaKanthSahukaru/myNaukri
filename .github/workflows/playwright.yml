name: Naukri profile automation

on:
  repository_dispatch:
    types: [trigger-next-loop]
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  actions: write # Required so the runner can trigger its own next workflow run

concurrency:
  group: naukri-profile-automation
  cancel-in-progress: true # Ensures only one active loop runs if you manually push code

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Discover Playwright tests
        run: npx playwright test --list --project=chromium

  update-profiles:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    # Extend execution timeout to handle the sleep period comfortably
    timeout-minutes: 45 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create local credentials file
        env:
          NAUKRI_CREDENTIALS_JSON: ${{ secrets.NAUKRI_CREDENTIALS_JSON }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const profiles = JSON.parse(process.env.NAUKRI_CREDENTIALS_JSON || 'null');
          if (!Array.isArray(profiles) || profiles.length !== 2 || profiles.some((profile) => !profile.email || !profile.password)) {
            throw new Error('Set the NAUKRI_CREDENTIALS_JSON repository secret to an array of two profile objects.');
          }
          fs.writeFileSync('credentials.json', JSON.stringify(profiles), { mode: 0o600 });
          NODE
          
      - name: Run profile updates
        run: npm run update-profiles -- --retries=0

      - name: Delay and Dispatch Next Chain Link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Profile update complete. Waiting 30 minutes inside GitHub Cloud..."
          sleep 1800
          
          echo "Dispatching the next execution link to the chain..."
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://github.com{{ github.repository }}/dispatches \
            -d '{"event_type": "trigger-next-loop"}'
